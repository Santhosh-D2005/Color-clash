name: Build signed Android release

# Produces the two artifacts a Play Store submission needs:
#
#   color-clash.aab  — Android App Bundle, what you upload to the Play Console
#   color-clash.apk  — signed APK, for sideloading and testing the same build
#
# Requires four repository secrets (Settings → Secrets and variables → Actions).
# See docs/PUBLISHING.md for how to generate the keystore and add them:
#
#   ANDROID_KEYSTORE_BASE64   base64 of your .jks file
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
#
# The keystore never exists in the repository — it is decoded into the runner's
# temporary directory and destroyed with the runner.

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name shown in the Play listing (e.g. 1.0.0)'
        required: true
        default: '1.0.0'
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      # A missing secret must stop the run here, not produce an unsigned
      # bundle that Play rejects twenty minutes later.
      - name: Check signing secrets are present
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$KEYSTORE" ]   && missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -z "$STORE_PASS" ] && missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -z "$ALIAS" ]      && missing="$missing ANDROID_KEY_ALIAS"
          [ -z "$KEY_PASS" ]   && missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            echo "See docs/PUBLISHING.md for how to create them."
            exit 1
          fi
          echo "All four signing secrets are set."

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install project
        run: npm install

      - name: Typecheck and test
        run: |
          npm run typecheck
          npm test

      # A store build must not carry anyone else's trademark. See docs/BRANDING.md.
      - name: Branding audit
        run: npm run audit:brand

      - name: Install Capacitor
        run: npm i -D @capacitor/core@^7 @capacitor/cli@^7 @capacitor/android@^7 @capacitor/assets@^3

      - name: Build the web app
        run: npm run build:pwa

      - name: Add the Android platform
        run: npx cap add android

      - name: Generate launcher icons and splash screens
        run: npx @capacitor/assets generate --android

      - name: Sync web assets
        run: npx cap sync android

      - name: Decode the keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          # RUNNER_TEMP is outside the workspace, so the key can never be
          # picked up by a later step that archives the checkout.
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          if [ ! -s "$RUNNER_TEMP/release.jks" ]; then
            echo "::error::Decoded keystore is empty — is ANDROID_KEYSTORE_BASE64 valid base64?"
            exit 1
          fi
          echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"

      - name: Configure signing and version
        env:
          CLASH_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          # Monotonic and unique per run, which is what Play requires.
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: ${{ inputs.version_name || github.ref_name }}
        run: npx tsx tools/android-release.ts

      - name: Build signed bundle and APK
        env:
          CLASH_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          CLASH_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CLASH_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CLASH_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew bundleRelease assembleRelease --no-daemon

      - name: Verify the outputs are actually signed
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "Using $BUILD_TOOLS"
          APK=android/app/build/outputs/apk/release/app-release.apk
          AAB=android/app/build/outputs/bundle/release/app-release.aab

          test -f "$APK" || { echo "::error::No release APK produced"; exit 1; }
          test -f "$AAB" || { echo "::error::No release AAB produced"; exit 1; }

          # An unsigned release build is the failure this whole workflow exists
          # to prevent, so it is checked rather than assumed.
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK" \
            || { echo "::error::Release APK is not signed"; exit 1; }
          echo "APK signature verified."

          # jarsigner covers the bundle, which apksigner does not read.
          jarsigner -verify "$AAB" \
            || { echo "::error::Release AAB is not signed"; exit 1; }
          echo "AAB signature verified."

      - name: Collect artifacts
        run: |
          mkdir -p out
          V="${{ inputs.version_name || github.ref_name }}"
          cp android/app/build/outputs/bundle/release/app-release.aab "out/color-clash-$V.aab"
          cp android/app/build/outputs/apk/release/app-release.apk "out/color-clash-$V.apk"
          ls -lh out/

      - uses: actions/upload-artifact@v4
        with:
          name: color-clash-release
          path: out/*
          retention-days: 30
          if-no-files-found: error

      - name: Remove the keystore from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
